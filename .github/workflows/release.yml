name: release
on:
  push:
    tags:
      - "v*"
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./... ./testdata/gen ./testdata/gen/cmd
      - run: go test ./...
  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [darwin/arm64, darwin/amd64, linux/amd64, linux/arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        env:
          TARGET: ${{ matrix.target }}
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          goos=${TARGET%/*}; goarch=${TARGET#*/}
          name="skillmeister_${TAG#v}_${goos}_${goarch}"
          mkdir -p "dist/$name"
          CGO_ENABLED=0 GOOS=$goos GOARCH=$goarch go build -mod=vendor -trimpath \
            -ldflags "-X github.com/shantanugoel/skillmeister/internal/version.Version=$TAG" \
            -o "dist/$name/skillmeister" ./cmd/skillmeister
          cp README.md THIRD_PARTY_NOTICES.md "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ strategy.job-index }}-archive
          path: dist/*.tar.gz
  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum *.tar.gz > SHA256SUMS
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          flags=""
          case "$TAG" in *-*) flags="--prerelease" ;; esac
          gh release create "$TAG" dist/*.tar.gz dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes $flags
